<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Barbie Toys | Mattel Brasil</title>
  <link rel="stylesheet" href="./style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
  <header class="top-header">
    <div class="brands-bar">
      <img src="../img/Captura de tela 2025-10-06 105609.png" alt="Mattel" class="brand-logo">
      <img src="../img/Captura de tela 2025-10-06 10815.png" alt="Barbie" class="brand-logo">
      <img src="img/" alt="Hot Wheels" class="brand-logo">
      <img src="img/logo-fisher.png" alt="Fisher Price" class="brand-logo">
      <span class="select-marca">Todas as marcas</span>

      <div class="idioma">
        <img src="img/brazil-flag.png" alt="Brasil">
        <span>Brasil</span>
      </div>
    </div>

    <div class="cabecalho">
      <img src="img/barbie-logo.png" class="logo" />
      <nav class="navegacao">
        <a href="#" class="item">Compra</a>
        <a href="#" class="item">Bonecas Fashion</a>
        <a href="#" class="item">Bonecas com Profissões</a>
        <a href="#" class="item">Casas de Bonecas</a>
      </nav>
      <div class="busca">
        <input type="text" placeholder="O que você está procurando?" />
        <button><img src="img/lupa.png" alt="Buscar" /></button>
      </div>
    </div>
  </header>

  <main>
    <section class="destaques">
      <img src="../img/Captura de tela 2025-10-06 105135.png" alt="Banner BarbieLand" />
      <img src="../img/Captura de tela 2025-10-06 105152.png" alt="Banner Dreamhouse" />
      <img src="../img/Captura de tela 2025-10-06 105205.png" alt="Banner Dream Besties" />
    </section>

    <section class="filtros">
      <h1>Tudo Barbie</h1>
      <div class="botoes-filtro">
        <button class="botao-rosa">Compra Tudo</button>
        <button class="botao-rosa">Bonecas Fashion</button>
        <button class="botao-rosa">Casas de Bonecas</button>
        <button class="botao-rosa">Roupa e Acessórios</button>
      </div>
    </section>
  </main>
</body>
</html>
